name: Purge jsDelivr CDN

on:
  schedule:
    - cron: '0 2 * * *'  # Каждый день в 02:00 UTC
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Purge jsDelivr CDN for all files
        run: |
          failed=0
          total=0
          while IFS= read -r file; do
            total=$((total + 1))
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${file}"
            echo "Purging: ${file}"
            if ! curl -sS -o /dev/null -I \
                 --retry 5 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 15 --max-time 60 \
                 "${url}"; then
              echo "::warning::Failed to purge ${file}"
              failed=$((failed + 1))
            fi
            sleep 1
          done < <(find . -type f -not -path "./.git/*" | sed 's|^\./||')

          echo "Purged $((total - failed))/${total} files."
          if [ "${failed}" -gt 0 ]; then
            echo "::error::${failed} of ${total} files could not be purged."
            exit 1
          fi
